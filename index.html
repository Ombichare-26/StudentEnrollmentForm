<!DOCTYPE html>
<html lang="en">

<head>
    <title>Student Enrollment Form</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>

<body onload="resetForm()">

    <div class="container">
        <h2 class="text-center">Student Enrollment Form</h2>

        <form id="studentForm">

            <div class="form-group">
                <label>Roll No :</label>
                <input type="text" id="rollNo" class="form-control" onchange="getStudent()">
            </div>

            <div class="form-group">
                <label for="fullName">Full Name :</label>
                <input type="text" id="fullName" class="form-control">
            </div>

            <div class="form-group">
                <label for="stuClass">Class :</label>
                <input type="text" id="stuClass" class="form-control">
            </div>

            <div class="form-group">
                <label for="birthDate">Birth Date :</label>
                <input type="date" id="birthDate" class="form-control">
            </div>

            <div class="form-group">
                <label for="address">Address :</label>
                <textarea id="address" class="form-control"></textarea>         
            </div>

            <div class="form-group">
                <label for="enrollDate">Enrollment Date :</label>
                <input type="date" id="enrollDate" class="form-control">    
            </div>

            <div class="text-center">

            <button type="button" class="btn btn-success" id="save" onclick="saveData()" disabled>Save</button>

            <button type="button" class="btn btn-primary" id="update" onclick="updateData()" disabled>Update</button>

            <button type="button" class="btn btn-danger" id="reset" onclick="resetForm()" disabled>Reset</button>

            </div>

        </form>

    </div>

    <script src="http://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>
    <script src="index.js"></script>

</body>
</html>
